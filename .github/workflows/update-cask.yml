name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (without v prefix)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Download DMG and compute SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_URL="https://github.com/yelog/vibebar/releases/download/v${VERSION}/VibeBar-${VERSION}-universal.dmg"
          
          echo "Downloading from: $DMG_URL"
          curl -L -o "VibeBar-${VERSION}.dmg" "$DMG_URL"
          
          SHA256=$(shasum -a 256 "VibeBar-${VERSION}.dmg" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"
          
          rm "VibeBar-${VERSION}.dmg"

      - name: Update Cask file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          CASK_FILE="Casks/vibebar.rb"
          
          echo "Updating $CASK_FILE with version=$VERSION and sha256=$SHA256"
          
          # Update version line
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" "$CASK_FILE"
          
          # Update sha256 line
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$CASK_FILE"
          
          echo "Updated Cask content:"
          cat "$CASK_FILE"

      - name: Verify Cask syntax
        run: |
          # Install Homebrew if not available (though it should be on macOS runners)
          if ! command -v brew &> /dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          
          # Add current repo as tap and validate
          brew tap-new vibebar/temp
          cp Casks/vibebar.rb "$(brew --repository vibebar/temp)/Casks/"
          
          # Check syntax
          brew style vibebar/temp/vibebar

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          VERSION="${{ steps.version.outputs.version }}"
          
          git add Casks/vibebar.rb
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: update vibebar to v${VERSION}"
          git push
          
          echo "Successfully updated Cask to v${VERSION}"
